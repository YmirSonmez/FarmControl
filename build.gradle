plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.froobworld'
version = '1.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.froobynooby'
        }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'
    implementation 'com.github.froobynooby:nab-configuration:master-SNAPSHOT'
    implementation 'org.bstats:bstats-base:3.2.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-Xlint:deprecation')
}

processResources {
    def props = [version: project.version.toString()]
    inputs.properties(props)
    filesMatching('plugin.yml') {
        expand(props)
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName = "FarmControl-${project.version}.jar"

    relocate 'com.froobworld.nabconfiguration', 'com.froobworld.farmcontrol.lib.nabconfiguration'
    relocate 'org.bstats', 'com.froobworld.farmcontrol.lib.bstats'
}

assemble.dependsOn(shadowJar)
