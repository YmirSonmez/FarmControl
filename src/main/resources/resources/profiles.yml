# Please visit https://github.com/froobynooby/FarmControl/wiki/Profiles for help with making profiles.
#
# Group options:
#   types / exclude-types: entity types or categories (e.g. "category:animal") that can / cannot be in the group.
#   count: how many entities are needed to form a group.
#   distance: how close (in blocks) entities must be to be grouped together, or same-chunk.
#   ignore-vertical-distance: whether to only consider horizontal distance.
#   pure: whether all entities in a group must be of the same type.
#   spawn-reasons: (optional) only group entities that came into the world for one of these reasons, e.g. spawner,
#     breeding, natural. All reasons are accepted if this is left out.
#
# Actions:
#   remove-random-movement, remove-awareness, remove-ai, disable-collisions, disable-breeding, kill, remove
#   disable-pathfinding: mobs keep their AI but can no longer find paths, so they stay where they are.
#   lock-breeding: like disable-breeding, but stored on the adult animal itself (it cannot even enter love mode).
#     Animals stay locked if the plugin is removed while the action is applied.
#   disable-mob-pickup: for items - mobs will no longer pick the item up.
#   prevent-spawn: stops more mobs of the group's types from spawning (naturally or from spawners) in the chunks the
#     group occupies. Nothing is done to the mobs already there.

profiles:
  # Remove random movements and disable collisions of mobs in animal farms
  soft-nerf-animal-farms:
    group:
      types:
        - "category:animal"
      count: 15
      distance: 5
    actions:
      - remove-random-movement
      - disable-collisions

  # Remove the awareness of mobs in animal farms
  hard-nerf-animal-farms:
    group:
      types:
        - "category:animal"
      count: 15
      distance: 5
    actions:
      - remove-awareness
      - disable-collisions

  # Remove the AI of mobs in animal farms
  freeze-animal-farms:
    group:
      types:
        - "category:animal"
      count: 15
      distance: 5
    actions:
      - remove-ai
      - disable-collisions

  # Disable breeding in farms containing 20 or more animals of the same type
  soft-limit-animal-farms:
    group:
      types:
        - "category:animal"
      count: 20
      distance: 5
      pure: true
    actions:
      - disable-breeding

  # Disable breeding in villager farms containing 20 or more villagers
  soft-limit-villager-breeders:
    group:
      types:
        - "villager"
      count: 20
      distance: 10
    actions:
      - disable-breeding

  # No more than 20 animals (all of the same type) within close proximity
  trim-animal-farms:
    group:
      types:
        - "category:animal"
      count: 21
      distance: 5
      pure: true
    actions:
      - kill

  # No more than 50 animals (all of the same type) sparsely placed (within 160 blocks of each other)
  trim-sparse-animal-farms:
    group:
      types:
        - "category:animal"
      count: 51
      distance: 160
      pure: true
    actions:
      - kill

  # No more than 10 villagers per chunk
  trim-villager-chunks:
    group:
      types:
        - "villager"
      count: 11
      distance: same-chunk
    actions:
      - kill

  # No more than 30 spawner mobs of the same type around a spawner - further spawns are prevented rather than removed
  limit-spawner-farms:
    group:
      types:
        - "category:monster"
      spawn-reasons:
        - spawner
      count: 30
      distance: 8
      pure: true
    actions:
      - prevent-spawn

  # Stop mobs from searching for and picking up items lying in large piles
  nerf-item-piles:
    group:
      types:
        - "item"
      count: 50
      distance: 5
    actions:
      - disable-mob-pickup
